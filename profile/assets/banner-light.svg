  </defs>
  <rect width="1280" height="320" rx="20" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="20" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="20" fill="none" stroke="#0d0f14" stroke-opacity="0.08"/>

  <g transform="translate(820 52)">
    <rect width="400" height="216" rx="6" fill="#ffffff" stroke="#9a7208" stroke-opacity="0.6" stroke-width="2"/>
    <rect x="8" y="8" width="150" height="120" rx="3" fill="#e0aa1c"/>
    <rect x="164" y="8" width="150" height="120" rx="3" fill="#e9bd45"/>
